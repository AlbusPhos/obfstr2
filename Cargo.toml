[package]
name = "obfstr2"
version = "0.3.3"
edition = "2024"
resolver = "2"
rust-version = "1.92"
authors = ["AlbusPhos <owo.zzz@proton.me>"]
description = "Polymorphic compile-time string/wide-str/wide-cstr/bytes/int/float/cstr/file obfuscation"
license = "MPL-2.0"
readme = "README.md"
documentation = "https://docs.rs/obfstr2"
repository = "https://github.com/AlbusPhos/obfstr2"
homepage = "https://github.com/AlbusPhos"
keywords = ["obfuscation", "string", "no-std", "compile-time", "polymorphic"]
categories = ["no-std", "embedded"]


[dependencies]
obfstr2-macros = { version = "=0.3.3", path = "obfstr2-macros" }
lib-unknown = { version = "=0.3.2", default-features = false, features = ["crypto", "types", "encoding"] }

[features]
default = [
    "lib-unknown/alloc",
    "obfstr2-macros/alloc",
]
# 栈预算控制：转发给 obfstr2-macros；同时启用多个时取最大档，未指定时默认 4 KiB
budget-1k = ["obfstr2-macros/budget-1k"]
budget-4k = ["obfstr2-macros/budget-4k"]
budget-16k = ["obfstr2-macros/budget-16k"]
budget-64k = ["obfstr2-macros/budget-64k"]
budget-256k = ["obfstr2-macros/budget-256k"]
budget-512k = ["obfstr2-macros/budget-512k"]
budget-1m = ["obfstr2-macros/budget-1m"]
budget-4m = ["obfstr2-macros/budget-4m"]
budget-8m = ["obfstr2-macros/budget-8m"]

[dev-dependencies]
lib-unknown = { version = "=0.3.2", features = ["dyntest"] }


[profile.release]
strip = "symbols"
debug = 0
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
